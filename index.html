<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cook & Create </title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#d9ecf8;--paper:#f3f9fe;--ink:#3a3a4a;--soft:#6f8499;--hl:#c6e0f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b2519;--paper:#352e20;--ink:#f1e6c8;--soft:#b3a283;--hl:#4a4030;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2b2519;--paper:#352e20;--ink:#f1e6c8;--soft:#b3a283;--hl:#4a4030;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mali","Sarabun","Noto Sans Thai",sans-serif;line-height:1.6}
main{max-width:1180px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{margin:0 0 14px;color:var(--soft)}

/* Auth Header Bar */
.auth-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:8px 12px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);flex-wrap:wrap}
.user-profile{display:flex;align-items:center;gap:10px}
.user-avatar{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);object-fit:cover;background:var(--hl)}
.user-info{display:flex;flex-direction:column;font-size:0.82rem;line-height:1.2}
.user-status{font-size:0.75rem;color:var(--soft)}
.btn-google{display:inline-flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:6px 14px;font-weight:600;cursor:pointer;transition:background 0.2s}
.btn-google:hover{background:var(--hl)}
.btn-google svg{width:18px;height:18px}

.layout{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.fridge{position:relative;padding:22px 40px 18px 18px}
.fridge>svg.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.frame *{fill:none;stroke:var(--ink);stroke-width:2.4;vector-effect:non-scaling-stroke;stroke-linecap:round}
.frame .bg{fill:var(--paper);stroke:none}
.shelf{position:relative;padding:4px 0 14px;margin-bottom:6px}
.shelf h2{font-size:.95rem;margin:0 0 4px;font-weight:600;color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:4px}
.shelf svg.ln{position:absolute;left:0;right:0;bottom:0;width:100%;height:8px;overflow:visible}
.ln path{fill:none;stroke:var(--ink);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linecap:round}
button{font:inherit;color:inherit;cursor:pointer}
.it{width:92px;background:none;border:0;padding:4px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:.78rem;line-height:1.25;text-align:center}
.it:hover{background:var(--hl)}
.it:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}
.it.out{opacity:.35}
.it.out .ic{visibility:hidden}
.it.out span{border-bottom:1.5px dashed var(--soft)}
.ic{width:64px;height:64px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:url(#rs)}
.panel{background:var(--paper);padding:16px;position:relative;filter:none}
.panel svg.bd{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.bd rect{fill:none;stroke:var(--ink);stroke-width:2.2;vector-effect:non-scaling-stroke}
.panel h2{font-size:1.05rem;margin:0 0 8px}
.tray{display:flex;flex-wrap:wrap;gap:6px;min-height:64px;align-items:flex-start}
.empty{margin:0;color:var(--soft);font-size:.9rem}
.chip{background:var(--hl);border:1.5px solid var(--ink);border-radius:14px 10px 15px 9px;display:flex;align-items:center;gap:2px;padding:2px 10px 2px 2px;font-size:.85rem;animation:pop .35s ease-out}
.chip .ic{width:42px;height:42px}
.tray.mix .chip{animation:shake .6s ease-in-out}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{background:var(--ink);color:var(--bg);border:2px solid var(--ink);border-radius:16px 10px 14px 10px;padding:8px 18px;font-weight:600}
.btn.ghost{background:none;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.menu{margin-top:18px;animation:pop .5s ease-out}
.menu[hidden]{display:none}
.menu .plate{width:210px;max-width:60%;display:block;margin:0 auto 6px}
.menu h3{font-size:1.3rem;margin:0 0 2px;text-align:center}
.menu p{margin:0 0 8px}
.menu ol{margin:0 0 8px;padding-left:20px}
.note{color:var(--soft);font-size:.88rem}
.plate *{stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round}
.plate .ic{stroke-width:2}
.fridge{perspective:1400px}
.lcol{min-width:0}
.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pal{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.pal[hidden]{display:none}
#pals{display:flex;flex-wrap:wrap;gap:6px}
.ps{width:46px;height:46px;background:var(--paper);border:1.5px solid var(--ink);border-radius:50%;padding:4px}
.ps:hover{background:var(--hl)}
.ps .ic{width:100%;height:100%}
.ic.sk{fill:var(--f)}
.door{position:absolute;inset:0;z-index:5;transform-origin:left center;transition:transform .8s cubic-bezier(.5,0,.2,1);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.door.open{transform:rotateY(-112deg);pointer-events:none}
.door>svg.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.door .bg{fill:var(--hl)}
.stkl{position:absolute;inset:1%}
.stk{position:absolute;width:var(--z,56px);height:var(--z,56px);transform:rotate(var(--r,0deg));cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.stk:active{cursor:grabbing}
.stk .ic{width:100%;height:100%;filter:url(#rs) drop-shadow(1px 2px 0 rgba(0,0,0,.2));pointer-events:none}
.stk.sel{outline:2px dashed var(--ink);outline-offset:3px;border-radius:12px;z-index:2}
.stk .x{display:none;position:absolute;top:-12px;right:-12px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);padding:0;font-size:11px;line-height:1;align-items:center;justify-content:center}
.stk.sel .x{display:flex}
.stk .rot,.stk .rsz{display:none;position:absolute;background:var(--paper);border:1.5px solid var(--ink);touch-action:none}
.stk.sel .rot,.stk.sel .rsz{display:block}
.stk .rot{width:24px;height:24px;border-radius:50%;left:calc(50% - 12px);top:-42px;cursor:grab}
.stk .rot::after{content:"";position:absolute;left:50%;top:100%;height:14px;border-left:1.5px solid var(--ink)}
.stk .rsz{width:22px;height:22px;border-radius:6px;right:-14px;bottom:-14px;cursor:nwse-resize}
.hdl{position:absolute;right:5%;top:36%;width:18px;height:26%;border:2.4px solid var(--ink);border-radius:10px 12px 10px 11px;background:var(--paper);padding:0;z-index:3}
.hdl:hover{background:var(--bg)}
.hdl:focus-visible{outline:2px dashed var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.door{transition:none}}
.rec{display:flex;align-items:center;gap:10px;margin:0 0 16px;padding:8px 10px;border:2px solid var(--ink);border-radius:16px 12px 15px 11px;background:var(--paper)}
.rtl{font-weight:600;white-space:nowrap}
.recl{display:flex;gap:6px;overflow-x:auto;padding:2px;min-width:0;scrollbar-width:thin}
.rc{flex:none;display:flex;align-items:center;gap:2px;background:var(--hl);border:1.5px solid var(--ink);border-radius:14px 10px 15px 9px;padding:2px 10px 2px 4px;font-size:.85rem;white-space:nowrap}
.rc:hover{background:var(--bg)}
.rc:focus-visible,.sw:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}
.rc .ic{width:30px;height:30px}
.rc small{color:var(--soft);margin-left:4px}
.ctray{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;padding:6px 10px;border:2px solid var(--ink);border-radius:14px 10px 13px 11px;background:var(--paper)}
#sws{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);background:var(--c);padding:0}
.sw[aria-pressed="true"]{outline:2px dashed var(--ink);outline-offset:2px}
.fridge{--fd:var(--hl);--fi:var(--paper)}
.fridge.tint{--fd:color-mix(in srgb,var(--sw) 55%,var(--paper));--fi:color-mix(in srgb,var(--sw) 22%,var(--paper))}
.fridge>svg.frame .bg{fill:var(--fi)}
.fridge .door .bg{fill:var(--fd)}
.tadd{display:flex;gap:6px;flex-wrap:wrap}
.tadd input{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:10px;padding:6px 10px;min-width:0;width:200px}
.stk.t{width:max-content;height:auto;max-width:85%}
.stk .tx{display:block;font-size:calc(var(--z,56px)*.3);line-height:1.25;padding:.35em .7em;background:var(--b,#fbe08a);color:#4a3b2a;border:2px solid #4a3b2a;border-radius:10px 14px 9px 13px;font-weight:600;white-space:pre-wrap;text-align:center;box-shadow:1px 2px 0 rgba(0,0,0,.2);pointer-events:none}
.it{transition:opacity .25s,transform .15s,background .15s}
.it:hover .ic{animation:wig .5s}
.it:active{transform:scale(.88)}
.ps{transition:transform .15s,background .15s}
.ps:hover{transform:scale(1.15) rotate(-6deg)}
.ps:active{transform:scale(.88)}
.chip{animation:none}
.chip.new{animation:pop .35s ease-out}
.stk.new{animation:stkin .55s cubic-bezier(.3,1.5,.5,1)}
.stk.bye{animation:stkout .23s ease-in forwards;pointer-events:none}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes stkin{0%{transform:rotate(var(--r)) scale(0)}60%{transform:rotate(calc(var(--r) + 25deg)) scale(1.2)}100%{transform:rotate(var(--r)) scale(1)}}
@keyframes stkout{to{transform:rotate(calc(var(--r) + 90deg)) scale(0);opacity:0}}
.wallet{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;padding:8px 12px;border:2px solid var(--ink);border-radius:14px 10px 13px 11px;background:var(--paper)}
.wc{display:flex;align-items:center;gap:4px;font-weight:600}
.wc .ic,.dcoin .ic{width:30px;height:30px;fill:#f6d860}
.wsp{flex:1}
#coin.bump{display:inline-block;animation:bump .5s}
.it{position:relative}
.bdg{position:absolute;top:0;right:4px;background:var(--hl);border:1.5px solid var(--ink);border-radius:10px;padding:0 6px;font-size:.7rem;line-height:1.35}
.it.low .bdg{background:#f6d860;color:#4a3b2a}
.it.none .ic{opacity:.3;filter:grayscale(1)}
.it.none .bdg{background:transparent;border-style:dashed;color:var(--soft)}
dialog{width:min(640px,94vw);max-height:88vh;padding:0;border:2.5px solid var(--ink);border-radius:18px 12px 16px 12px;background:var(--paper);color:var(--ink);font-family:inherit}
dialog::backdrop{background:rgba(60,45,25,.45)}
.dh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:2px solid var(--ink);flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.tab{background:none;border:1.5px solid var(--ink);border-radius:12px 9px 11px 9px;padding:4px 12px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dcoin{display:flex;align-items:center;gap:4px;font-weight:600}
.dx{background:none;border:1.5px solid var(--ink);border-radius:50%;width:30px;height:30px;padding:0}
.dbody{padding:10px 14px 16px;overflow:auto;max-height:calc(88vh - 62px)}
.dbody h3{font-size:.95rem;margin:12px 0 4px;color:var(--soft)}
.row{display:flex;align-items:center;gap:8px;padding:2px 4px;border-radius:10px}
.row.hl{background:var(--hl);animation:pop .4s}
.row .ic{width:34px;height:34px;flex:none}
.row .nm{flex:1;display:flex;flex-direction:column;line-height:1.2}
.row small{color:var(--soft)}
.pr{font-weight:600;min-width:2ch;text-align:right}
.btn.mini{padding:2px 10px;font-size:.85rem;border-radius:12px 8px 11px 8px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:10px}
.sum div{border:1.5px solid var(--ink);border-radius:12px;padding:6px 8px;text-align:center;background:var(--hl)}
.sum b{display:block;font-size:1.2rem}
.sum small{color:var(--soft)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:3px 6px;border-bottom:1px dashed var(--soft);text-align:center;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td .ic{width:22px;height:22px;vertical-align:middle}
tr.z td{color:var(--soft)}
tr.l td:nth-child(5){color:#c0392b;font-weight:600}
.log{list-style:none;margin:0 0 12px;padding:0;font-size:.85rem}
.log li{display:flex;gap:8px;padding:2px 0;border-bottom:1px dashed var(--soft)}
.log span{color:var(--soft)}
.log b{margin-left:auto}
.pos{color:#2e7d4f}.neg{color:#c0392b}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:14px 10px 13px 10px;opacity:0;pointer-events:none;transition:.3s;z-index:80;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.reward{display:flex;align-items:center;gap:4px;margin-top:8px;padding:6px 10px;background:var(--hl);border:1.5px solid var(--ink);border-radius:12px;font-weight:600;font-size:.9rem}
.reward .ic{width:24px;height:24px;fill:#f6d860;flex:none}
@keyframes bump{40%{transform:scale(1.5)}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-6deg) translateY(-3px)}50%{transform:rotate(6deg) translateY(-5px)}80%{transform:rotate(-3deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* pastel blue theme + tidy tables */
dialog::backdrop{background:rgba(40,60,85,.45)}
.tw{overflow:auto;max-height:52vh;border:2px solid var(--ink);border-radius:12px}
table{min-width:580px;border-collapse:separate;border-spacing:0;font-size:.9rem;border:0}
thead th{position:sticky;top:0;z-index:1;background:var(--ink);color:var(--bg);font-weight:600;padding:8px 10px;white-space:nowrap;border-bottom:0;text-align:center}
thead th:first-child{text-align:left}
td{padding:7px 10px;vertical-align:middle;border-bottom:1px solid var(--hl);font-variant-numeric:tabular-nums}
tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--hl) 45%,transparent)}
tbody tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}
td .ic{width:26px;height:26px;margin-right:8px;vertical-align:middle;display:inline-block}
td:nth-child(5){white-space:nowrap;font-weight:600;color:#2e7d4f}
td .btn.mini{white-space:nowrap}
.dbody h3{font-size:1.1rem;color:var(--ink);margin:16px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--ink)}

/* clear grid lines for stock and shop tables */
.dbody td{border-bottom:1px solid var(--soft)}
.dbody td+td{border-left:1px solid var(--soft)}
.dbody th+th{border-left:1px solid rgba(255,255,255,.35)}
.shop table{min-width:430px}
.shop tbody tr:nth-child(even) td{background:transparent}
.shop td:nth-child(2),.shop td:nth-child(3){text-align:center;font-weight:600}
.shop td.buy{white-space:nowrap;text-align:center}
.shop tr.cat td{background:var(--hl);font-weight:600;font-size:1rem;border-left:0;border-bottom:2px solid var(--ink)}
.shop tr.hl td{background:#fff3b0;color:#3a3a4a}

/* brown wicker basket with red gingham cloth */
.tray{position:relative;margin-top:46px;min-height:120px;padding:12px;border:12px solid transparent;border-radius:10px 10px 30px 30px;
 background-image:linear-gradient(90deg,rgba(205,40,40,.62) 50%,transparent 50%),linear-gradient(rgba(205,40,40,.62) 50%,transparent 50%),linear-gradient(#fff,#fff),repeating-linear-gradient(45deg,#9a6a35 0 6px,#7b4f26 6px 12px);
 background-size:28px 28px,28px 28px,auto,auto;background-clip:padding-box,padding-box,padding-box,border-box;background-origin:padding-box,padding-box,padding-box,border-box;
 box-shadow:0 5px 0 #5e3a18}
.tray::before{content:"";position:absolute;left:14%;right:14%;top:-58px;height:46px;border:9px solid #7b4f26;border-bottom:0;border-radius:70px 70px 0 0}
.tray .empty{display:inline-block;background:rgba(255,255,255,.9);color:#3a3a4a;padding:3px 10px;border-radius:10px}

/* vertical expanding tab bar (transparent) */
dialog{width:min(720px,96vw);max-height:none;border:0;background:transparent;overflow:visible}
dialog[open]{display:block}
.dwrap{display:flex;gap:8px;align-items:flex-start}
.vt{position:relative;z-index:2;flex:none;width:46px;display:flex;flex-direction:column;gap:8px;padding-top:6px;background:transparent}
.tab{display:flex;align-items:center;width:max-content;height:46px;min-width:46px;padding:0 10px;gap:0;overflow:hidden;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:23px;transition:background .2s,color .2s}
.tab .ic{width:24px;height:24px;flex:none;stroke:currentColor;filter:none}
.tab .lb{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-weight:600;transition:max-width .3s ease,opacity .2s,margin .3s}
.tab:hover .lb,.tab:focus-visible .lb,.tab.peek .lb{max-width:9em;opacity:1;margin:0 6px 0 8px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tab:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}
.dmain{flex:1;min-width:0;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;border:2.5px solid var(--ink);border-radius:18px 12px 16px 12px;background:var(--paper)}
.dh{justify-content:flex-end}
.dbody{flex:1;max-height:none}
@media (prefers-reduced-motion:reduce){.tab,.tab .lb{transition:none}}

/* profile + frames */
.dbody{min-height:0}
.user-profile{cursor:pointer}
.avwrap{--s:34px;display:inline-block;flex:none;width:var(--s);height:var(--s);border-radius:50%;line-height:0}
.avwrap .user-avatar{width:100%;height:100%;display:block}
#avw{--s:40px}
.avwrap[class*="fr-"]{padding:calc(var(--s)*.1);background:var(--g)}
.avwrap[class*="fr-"] .user-avatar{border:2px solid var(--paper)}
.fr-mint{--g:#7cc6a0}
.fr-dot{--g:repeating-conic-gradient(#f28bb0 0 12deg,#fff 12deg 24deg)}
.fr-gold{--g:conic-gradient(#f6d860,#b98a14,#fff3b0,#b98a14,#f6d860)}
.fr-rb{--g:conic-gradient(#f66,#fa5,#fe5,#7d7,#5cf,#76f,#f6c,#f66)}
.pf{display:flex;gap:12px;align-items:center;flex-wrap:nowrap;margin-top:6px;padding:10px 12px;border:2px solid var(--ink);border-radius:16px 12px 15px 11px;background:var(--hl)}
.pfc{display:flex;flex-direction:column;gap:8px;min-width:0;flex:1}
.pfc .tadd{align-items:center}
.pfc .tadd input{width:auto;flex:1 1 90px;min-width:0}
.pfc .tadd .btn{padding:6px 12px}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{display:inline-block;cursor:pointer}
label.btn:focus-within{outline:2px dashed var(--ink);outline-offset:2px}
.frow{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--soft)}
.frow .fn{flex:1;display:flex;flex-direction:column;line-height:1.25}
.frow small{color:var(--soft)}
.user-profile{cursor:default}
#avw{cursor:pointer}
.uname-in{font:inherit;font-weight:600;font-size:.9rem;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:6px;padding:1px 8px;width:auto;max-width:100%;min-width:64px}
.uname-in:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}
/* auth bar: keep name/status on one horizontal line */
.user-profile{flex:1 1 auto;min-width:0}
.user-info{min-width:0}
.user-info strong,.user-status{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* old brown recipe book */
.bkroot{padding:4px 0}
.cover{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;width:100%;max-width:280px;aspect-ratio:3/4;margin:8px auto;padding:24px 24px 24px 34px;border:0;border-radius:6px 16px 16px 6px;color:#e8cf8f;font:inherit;cursor:pointer;

/* ===== full-screen kitchen background + clear glass UI ===== */
:root{--bg:#fdf4de;--paper:rgba(255,255,255,.46);--hl:rgba(255,255,255,.34);--soft:#6f6a5e;--line:rgba(58,58,74,.26);--dlg:rgba(255,255,255,.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:rgba(40,32,20,.56);--hl:rgba(255,255,255,.12);--line:rgba(241,230,200,.26);--dlg:rgba(40,32,20,.88)}
 body::before,body::after{filter:brightness(.5)}
 .fridge{--paper:#352e20;--hl:#4a4030}}
:root[data-theme="dark"]{--paper:rgba(40,32,20,.56);--hl:rgba(255,255,255,.12);--line:rgba(241,230,200,.26);--dlg:rgba(40,32,20,.88)}
:root[data-theme="dark"] body::before,:root[data-theme="dark"] body::after{filter:brightness(.5)}
:root[data-theme="dark"] .fridge{--paper:#352e20;--hl:#4a4030}
.fridge{--paper:#f6fafd;--hl:#cfe4f3}

/* kitchen fills the whole viewport behind everything */
html{min-height:100%;background:#fdf4de}
body{background:transparent;min-height:100vh;min-height:100dvh}
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
 background:
  linear-gradient(#a9794a,#a9794a) 0 calc(100% - 18vh)/100% 4px no-repeat,
  repeating-linear-gradient(90deg,transparent 0 118px,rgba(110,72,36,.4) 118px 120px) 0 100%/100% 18vh no-repeat,
  linear-gradient(#d3a874,#bf8f58) 0 100%/100% 18vh no-repeat,
  linear-gradient(#fdf4de,#f5e3bf)}
body::after{content:"";position:fixed;left:0;right:0;top:50vh;height:20vh;z-index:-1;pointer-events:none;
 border-top:2px solid rgba(58,58,74,.3);border-bottom:2px solid rgba(58,58,74,.3);
 background:linear-gradient(90deg,#fff 0 2px,transparent 2px) 0 0/34px 34px,linear-gradient(#fff 0 2px,transparent 2px) 0 0/34px 34px,#d2eadf}

/* use the whole screen width */
main{max-width:none;width:100%;padding:12px clamp(10px,2vw,28px) 40px}
.kwrap{border:0;background:transparent;box-shadow:0 12px 30px rgba(80,50,20,.18)}

/* glass UI: clear, thin lines, no heavy outlines */
.auth-bar,.wallet,.rec,.ctray,.decor,.panel,.steps button,.kmv button,.btn-google,.pf{
 background:var(--paper);border:1px solid var(--line);
 -webkit-backdrop-filter:blur(10px) saturate(1.1);backdrop-filter:blur(10px) saturate(1.1)}
.auth-bar,.wallet,.rec,.ctray,.decor{border-radius:16px}
.panel{max-width:760px;margin:0 auto 24px;border-radius:20px;padding:18px}
.panel svg.bd{display:none}
.steps button{border-radius:999px}
.steps b{border:1px solid var(--line);background:rgba(255,255,255,.5)}
.steps .done{background:rgba(155,211,174,.6)}
.steps .now{background:rgba(246,216,96,.8)}
.chip,.rc,.reward{background:rgba(255,255,255,.55);border:1px solid var(--line)}
.btn{border:1px solid var(--ink)}
.btn.ghost{background:rgba(255,255,255,.35)}
.btn.ghost:hover{background:rgba(255,255,255,.65)}
.uname-in,.tadd input{background:rgba(255,255,255,.5);border:1px solid var(--line)}
.user-avatar{border:1px solid var(--line)}
.tab{background:var(--paper);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab[aria-pressed="true"]{background:var(--ink)}
.dmain{background:var(--dlg);border:1px solid var(--line);border-radius:20px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.dh{border-bottom:1px solid var(--line)}
.dx{border:1px solid var(--line);background:transparent}
.tw{border:1px solid var(--line)}
.dbody h3{border-bottom:1px solid var(--line)}
.dbody td{border-bottom-color:var(--line)}
.dbody td+td{border-left-color:var(--line)}
.shop tr.cat td{border-bottom:1px solid var(--line)}
h1,.sub{text-shadow:0 1px 6px rgba(255,255,255,.7)}

/* ===== single-screen kitchen: camera, HUD, centered window ===== */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
main{position:fixed;left:0;top:0;width:100%;height:100vh;height:100dvh;max-width:none;margin:0;padding:0;overflow:hidden;overflow:clip}

.panel.open .tray{display:flex}

.kmv{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);margin:0;padding:0 8px;display:flex;justify-content:space-between;pointer-events:none;z-index:25}
.kmv button{pointer-events:auto;width:44px;height:44px;font-size:1.6rem;line-height:1;border-radius:50%;padding:0;background:var(--paper);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.kmv button:disabled{opacity:.25;cursor:default}
.zout{position:absolute;left:12px;top:calc(var(--padT,120px) + 8px);z-index:31;display:none;padding:6px 16px;border-radius:999px;font-weight:600;background:var(--ink);color:var(--bg);border:0;box-shadow:0 2px 10px rgba(0,0,0,.18)}
body:not([data-zone="home"]) .zout{display:inline-flex}
.toast{bottom:calc(var(--padB,100px) + 56px)}

/* centered window for the served menu */
.mwin{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(40,50,60,.3);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.mwin:has(>.mcard>#menu:not([hidden])){display:flex}
.mcard{position:relative;width:min(520px,100%);max-height:100%;display:flex}
.mcard #menu{margin:0;width:100%;max-height:100%;overflow:auto;padding:22px 18px 18px;background:var(--dlg);border:1px solid var(--line);border-radius:22px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#mclose{position:absolute;top:8px;right:8px;z-index:2;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.55);padding:0;line-height:1}
dialog[open]{margin:auto}

@media (max-width:760px){
 .hud{gap:5px;padding-left:8px;padding-right:8px}
 .hud h1,.rtl,#tot,.user-info,#authTxt,.panel h2{display:none}
 .auth-bar{padding:3px 6px;gap:4px}
 .btn-google{padding:5px 7px}
 .wallet{flex:1 1 0;min-width:0;margin-left:0;flex-wrap:nowrap;gap:5px;padding:3px 8px}
 .wallet .wc{font-size:0}
 .wallet .wc b{font-size:.85rem}
 .wallet .wc .ic{width:24px;height:24px}
 .wallet .btn{padding:3px 6px;font-size:.72rem;white-space:nowrap}
 .rec{padding:3px 8px}
 .steps{flex:1 1 100%;justify-content:flex-start}
 .panel{margin-left:auto}
 .panel .btn{padding:4px 9px;font-size:.8rem}
 .kmv button{width:38px;height:38px}
}
</style>

let saveTimer = null, chain = Promise.resolve(), dirty = false, lastErrToast = 0;
async function realSave() {
  if (!cloudReady || loadingCloud || !auth || !auth.currentUser || !isGoogleUser) return;
  const ts = Date.now();
  const payload = {
    G: window.G || {},
    stks: window.stks || [],
    fridgeColor: (() => { try { return localStorage.getItem("fridgeColor") || ""; } catch (e) { return ""; } })(),

  };

    writeLocalTs(ts);
  } catch (err) {
    console.error("Cloud save failed:", err);
    dirty = true;
    if (Date.now() - lastErrToast > 30000) { lastErrToast = Date.now(); toastMsg("เซฟขึ้นคลาวด์ไม่สำเร็จ ข้อมูลยังอยู่ในเครื่อง"); }

  clearTimeout(saveTimer); saveTimer = null;

  chain = chain.then(realSave);
  return chain;
}

const imgCol = () => collection(db, 'artifacts', appId, 'public', 'data', 'ingImages');
async function loadIngImages() {
  if (!cloudReady || !db) return;
  try {
    let last = 0;
    try { last = Number(localStorage.getItem("ingImgTs") || 0); } catch (e) {}
    const cur = window.getIngImages();
    if (!Object.keys(cur).length) last = 0;   // แคชว่าง = ดึงใหม่ทั้งหมด
    const snap = await getDocs(query(imgCol(), where("updatedAt", ">", last)));  // ดึงเฉพาะที่เปลี่ยนหลังจากครั้งก่อน
    if (snap.empty) return;
    const m = { ...cur };
    let mx = last;
    snap.forEach(d => {
      const v = d.data(); if (!v) return;
      mx = Math.max(mx, Number(v.updatedAt) || 0);
      if (typeof v.img === "string" && v.img) m[d.id] = v.img; else delete m[d.id];
    });
    window.setIngImages(m);
    try { localStorage.setItem("ingImgTs", String(mx)); } catch (e) {}
  } catch (err) {
    console.warn("Load ingredient images failed:", err);
  }
}

  (async () => {

        await signInWithCustomToken(auth, __initial_auth_token);
      }
    } catch (err) {
      console.warn("Auth initialization fallback:", err);
    }
  })();

  onAuthStateChanged(auth, async (user) => {
    isGoogleUser = !!(user && !user.isAnonymous && user.providerData.some(p => p.providerId === 'google.com'));
    const wasOwner = window.isOwner;
    const byUid = !!(OWNER_UID && user && user.uid === OWNER_UID);
    const byEmail = !!(!OWNER_UID && OWNER_EMAIL && user && user.email && user.emailVerified && user.email.toLowerCase() === OWNER_EMAIL.toLowerCase());

$u("btnAuth").addEventListener("click", async () => {
  if (!cloudReady) {
    toastMsg("ยังไม่ได้ใส่ค่า Firebase ในโค้ด (MY_FIREBASE_CONFIG)");
    return;
  }
  if (location.protocol === "file:") {
    toastMsg("ล็อกอินไม่ได้เมื่อเปิดเป็นไฟล์ในเครื่อง ต้องเผยแพร่เป็นเว็บ (https) ก่อน");
    return;
  }
  if (isGoogleUser) {
    try {
      await flushSave();
      await signOut(auth);
      toastMsg("ออกจากระบบเรียบร้อยแล้ว");
    } catch (e) {
      console.error(e);
    }
    return;
  }
  try {
    const res = await signInWithPopup(auth, googleProvider);
    toastMsg("ยินดีต้อนรับ " + (res.user.displayName || ""));
  } catch (e) {
    console.error("Login failed:", e);
    if (e.code === 'auth/unauthorized-domain' || e.code === 'auth/popup-blocked') {
      try {
        await signInWithRedirect(auth, googleProvider);
      } catch (redirErr) {
        console.error(redirErr);
        toastMsg("โดเมนนี้ยังไม่ได้เปิดใช้งาน Google Auth ใน Firebase Console");
      }
    } else if (e.code === 'auth/operation-not-supported-in-this-environment') {
      toastMsg("เบราว์เซอร์/สภาพแวดล้อมนี้ล็อกอิน Google ไม่ได้ ลองเปิดผ่านเว็บที่เผยแพร่แล้ว");
    } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
      toastMsg("เข้าสู่ระบบไม่สำเร็จ: " + (e.message || "โปรดลองใหม่อีกครั้ง"));
    }
  }
});

function fname(m){
  const SH={mince:"หมูสับ",belly:"หมูสามชั้น",chop:"หมู",chicken:"ไก่",shrimp:"กุ้ง",egg:"ไข่"};
  const mt=(m.filter(i=>SH[i]).map(i=>SH[i]))[0]||"",veg=m.filter(i=>cat(i)==="veg").map(nm);
  if(m.includes("rice"))return"ข้าวผัด"+mt;
  if(!mt)return veg.length>1?"ผัดผักรวมมิตร":"ผัด"+veg[0];
  if(!veg.length)return mt+"ผัดง่ายๆ";
  return veg.length>2?"ผัดผักรวม"+mt:mt+"ผัด"+veg.join("");
}

layer.addEventListener("pointermove",e=>{
  if(!drag)return;
  if(drag.mode){
    const{s,el,cx,cy,r}=drag;

    else{
      const z=Math.max(28,Math.min(180,Math.round(drag.z0*Math.hypot(e.clientX-cx,e.clientY-cy)/drag.d0)));
      s.z=z;el.style.setProperty("--z",z+"px");s.x=(drag.ccx-el.offsetWidth*(window.KS||1)/2)/r.width*100;s.y=(drag.ccy-el.offsetHeight*(window.KS||1)/2)/r.height*100;
      el.style.setProperty("--z",z+"px");el.style.left=s.x+"%";el.style.top=s.y+"%";
    }
    return;
  }
  const{s,el,r,dx,dy}=drag;
  const mx=(r.width-el.offsetWidth*(window.KS||1))/r.width*100,my=(r.height-el.offsetHeight*(window.KS||1))/r.height*100;
  s.x=Math.max(0,Math.min(mx,(e.clientX-dx-r.left)/r.width*100));
  s.y=Math.max(0,Math.min(my,(e.clientY-dy-r.top)/r.height*100));
  el.style.left=s.x+"%";el.style.top=s.y+"%";
});

const UNIV=new Set(["rice","oil","salt","sugar","pepper","fish","soy","oyster"]);
function pubR(){const ck=window.G.cooked||{};return R.filter(r=>!r.secret||ck[r.n])}
function rTotal(){return pubR().length}
function monthEndNote(empty){
  const t=new Date(),last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate(),ck=window.G.cooked||{};
  const sec=R.find(r=>r.secret);
  return empty&&sec&&!ck[sec.n]&&t.getDate()>=last-2?'<span class="note">สิ้นเดือนแล้ว มีเมนูลับรออยู่ ลองข้าวสวยกับน้ำปลา</span> ':"";
}
function fit(r,S){
  const al=new Set([...r.need,...r.opt,...(r.any||[])]);
  const miss=r.need.filter(x=>!S.has(x)).map(nm);
  if(r.any&&!r.any.some(x=>S.has(x)))miss.push(r.anyName||"เนื้อสัตว์");
  const stray=[...S].filter(i=>!UNIV.has(i)&&!al.has(i)).map(nm);
  const hit=r.need.filter(x=>S.has(x)).length+(r.any&&r.any.some(x=>S.has(x))?1:0);
  return{r,miss,stray,hit,ok:!miss.length&&!stray.length};
}
function sugg(S){
  return pubR().filter(r=>!r.weird).map(r=>fit(r,S)).filter(o=>o.hit>0).sort((a,b)=>(a.miss.length+a.stray.length)-(b.miss.length+b.stray.length)||b.hit-a.hit).map(o=>({...o,
    tip:[o.miss.length?"เพิ่ม "+o.miss.join(", "):"",o.stray.length?"เอาออก "+o.stray.join(", "):""].filter(Boolean).join(" และ "),
    tag:[o.miss.length?"ขาด"+o.miss.slice(0,2).join(","):"",o.stray.length?"เกิน"+o.stray.slice(0,2).join(","):""].filter(Boolean).join(" ")||"ครบแล้ว"}));
}
function pick2(sel){
  const S=new Set(sel);let best=null,bs=-1;
  if(S.size===ITEMS.length&&ITEMS.every(i=>S.has(i[0]))){const w=R.find(r=>r.weird);if(w)return w}
  for(const r of R){if(r.weird||!fit(r,S).ok)continue;const s=r.need.length*3+(r.any?3:0)+r.opt.filter(o=>S.has(o)).length;if(s>bs){bs=s;best=r}}
  return best;
}
function noMatch(sel){
  const S=new Set(sel);
  if(![...S].some(i=>!UNIV.has(i)))return"<p>ยังเลือกไม่พอสำหรับทำเมนู ลองหยิบเนื้อสัตว์ ไข่ อาหารทะเล หรือผักเพิ่ม</p>";
  const L=sugg(S).slice(0,3);
  return"<p><b>ของชุดนี้ยังไม่ตรงกับเมนูไทยที่รู้จัก</b> จึงไม่รวมให้เป็นเมนูแปลกๆ</p>"+(L.length?`<p class="note">เมนูที่ใกล้เคียง</p><ul>${L.map(o=>`<li>${o.r.n} <span class="note">(${o.tip})</span></li>`).join("")}</ul>`:"");
}
function renderRec(){
  const S=new Set(sel),d=new Date().getDate();
  let L;
  if(!sel.length)L=pubR().filter(r=>!r.weird).map((r,i)=>({r,k:(i*7+d*13)%53})).sort((a,b)=>a.k-b.k).slice(0,8).map(o=>({r:o.r,tag:""}));
  else L=sugg(S).slice(0,8).map(o=>({r:o.r,tag:o.tag}));
  $("recl").innerHTML=monthEndNote(!sel.length)+(L.length?L.map(({r,tag})=>`<button class="rc" data-n="${R.indexOf(r)}" title="${r.d}">${r.need.slice(0,3).map(i=>ic(i)).join("")}${r.n}${tag?`<small>${tag}</small>`:""}</button>`).join(""):'<span class="empty">ลองหยิบวัตถุดิบเพิ่ม เดี๋ยวแนะนำเมนูให้</span>');
}
$("recl").addEventListener("click",e=>{
  const b=e.target.closest(".rc");if(!b)return;
  const r=R[+b.dataset.n],S=new Set(sel),ids=[...r.need];

  if(closed)setDoor(false);

});

function fly(b){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const src=b.querySelector(".ic");if(!src)return;
  const a=src.getBoundingClientRect(),toTray=b.classList.contains("it");
  let t;
  if(toTray)t=($("kbasket")||$("tray")).getBoundingClientRect();
  else{const it=document.querySelector(`.it[data-id="${b.dataset.id}"] .ic`);if(!it||$("shelves").inert)return;t=it.getBoundingClientRect()}
  const c=src.cloneNode(true);
  Object.assign(c.style,{position:"fixed",left:a.left+"px",top:a.top+"px",width:a.width+"px",height:a.height+"px",zIndex:60,pointerEvents:"none"});
  document.body.appendChild(c);
  const dx=t.left+(toTray?24:0)-a.left,dy=t.top+(toTray?20:0)-a.top;
  c.animate([{transform:"translate(0,0) scale(1) rotate(0deg)",opacity:1},{transform:`translate(${dx*.5}px,${dy*.5-40}px) scale(1.3) rotate(160deg)`,opacity:1,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.7) rotate(360deg)`,opacity:.2}],{duration:550,easing:"cubic-bezier(.4,0,.2,1)"}).onfinish=()=>c.remove();
}

const coinIc='<svg class="ic" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-coin"/></svg>';

let G={coins:50,stock:{},last:"",log:[],cooked:{}},fresh=true,tab="shop",hlIds=[],rstArm=false,cooking=false;
window.G = G;

window.saveGLocally = (silent)=>{try{localStorage.setItem("fridgeSave",JSON.stringify(window.G))}catch(e){}if(!silent)touchLocal()};
function saveG(){
  window.saveGLocally();
  if(window.saveCloudData) window.saveCloudData();
}

try{const s=JSON.parse(localStorage.getItem("fridgeSave")||"null");if(s&&typeof s.coins==="number"){window.G=sanitizeG({...G,...s});fresh=false}}catch(e){}
if(fresh){window.G.log=[{t:Date.now(),d:"โบนัสเริ่มต้นผู้ใช้ใหม่",c:50}]}
if(!window.G.starter){ITEMS.forEach(i=>{window.G.stock[i[0]]=Math.min(99,(window.G.stock[i[0]]||0)+1)});window.G.starter=true;addLog("รับวัตถุดิบเริ่มต้น อย่างละ 1 ชิ้น",0);window.saveGLocally(true);if(!fresh)setTimeout(()=>toast("ได้รับวัตถุดิบเริ่มต้น อย่างละ 1 ชิ้น"),500)}

const st=id=>window.G.stock[id]||0;
function addLog(d,c){window.G.log.unshift({t:Date.now(),d,c});if(window.G.log.length>60)window.G.log.length=60}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove("on"),2600)}
window.toast = toast;

function renderWallet(bump){
  const c=$("coin");c.textContent=window.G.coins;
  if(bump){c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump")}
  const done=window.G.last===todayStr();
  $("chk").disabled=done;$("chk").textContent=done?"เช็คอินแล้ววันนี้":"เช็คอินวันนี้ +10";
  $("tot").textContent="ของในตู้ "+Object.values(window.G.stock).reduce((a,b)=>a+b,0)+" ชิ้น";
}

function renderStock(){
  document.querySelectorAll(".it").forEach(b=>{
    const id=b.dataset.id,inT=sel.includes(id),n=st(id)-(inT?1:0);
    let g=b.querySelector(".bdg");if(!g){g=document.createElement("b");g.className="bdg";b.appendChild(g)}
    g.textContent=n>0?"×"+n:"หมด";
    b.classList.toggle("none",n<=0&&!inT);b.classList.toggle("low",n===1);
  });
  renderWallet();
  if(typeof kUpdate==="function")kUpdate();
}
window.renderStock = renderStock;

function checkIn(){
  if(window.G.last===todayStr())return;
  window.G.last=todayStr();window.G.coins+=10;addLog("เช็คอินรายวัน",10);saveG();renderWallet(true);
  if($("dlg").open)drawDlg();
  toast("เช็คอินสำเร็จ +10 เหรียญ");
}

function shopHtml(){
  const c=window.G.coins;
  const rows=CATS.map(([k,t])=>`<tr class="cat"><td colspan="4">${t}</td></tr>`+ITEMS.filter(i=>i[2]===k).map(([id,n])=>{
    const p=PRICE[id];
    return`<tr${hlIds.includes(id)?' class="hl"':''}><td>${ic(id)}${n}</td><td>${st(id)}</td><td>${p}</td><td class="buy"><button class="btn mini" data-buy="${id}" data-q="1"${c<p?" disabled":""}>+1</button> <button class="btn mini ghost" data-buy="${id}" data-q="5"${c<p*5?" disabled":""}>+5</button></td></tr>`;
  }).join("")).join("");
  return`<div class="tw shop"><table><thead><tr><th>วัตถุดิบ</th><th>มีอยู่ (ชิ้น)</th><th>ราคา (เหรียญ)</th><th>ซื้อ</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function backHtml(){
  const ids=ITEMS.map(i=>i[0]),have=ids.filter(i=>st(i)>0).length,cnt=ids.reduce((a,i)=>a+st(i),0),val=ids.reduce((a,i)=>a+st(i)*PRICE[i],0);
  const rows=ITEMS.map(([id,n])=>{const q=st(id);return`<tr class="${q===0?"z":q===1?"l":""}"><td>${ic(id)} ${n}</td><td>${q}</td><td>${PRICE[id]}</td><td>${q*PRICE[id]}</td><td>${q===0?"หมด":q===1?"ใกล้หมด":"ปกติ"}</td><td><button class="btn mini" data-buy="${id}" data-q="1"${window.G.coins<PRICE[id]?" disabled":""}>เติม +1</button></td></tr>`}).join("");
  const log=window.G.log.slice(0,15).map(l=>`<li><span>${new Date(l.t).toLocaleString("th-TH",{dateStyle:"short",timeStyle:"short"})}</span> ${esc(l.d)} <b class="${l.c<0?"neg":"pos"}">${l.c>0?"+":""}${l.c}</b></li>`).join("")||"<li>ยังไม่มีรายการ</li>";
  return`<div class="sum"><div><b>${have}/${ids.length}</b><small>ชนิดที่มีของ</small></div><div><b>${cnt}</b><small>ชิ้นรวม</small></div><div><b>${val}</b><small>มูลค่าสต็อก (เหรียญ)</small></div><div><b>${Object.keys(window.G.cooked||{}).length}/${rTotal()}</b><small>เมนูที่เคยทำ</small></div></div><div class="tw"><table><thead><tr><th>วัตถุดิบ</th><th>ในตู้</th><th>ราคา/ชิ้น</th><th>มูลค่า</th><th>สถานะ</th><th></th></tr></thead><tbody>${rows}</tbody></table></div><h3>ประวัติเหรียญ</h3><ul class="log">${log}</ul><button class="btn ghost" id="rst">รีเซ็ตข้อมูลทั้งหมด</button>`;
}

function drawDlg(){
  rstArm=false;$("dcoin").textContent=window.G.coins;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t===tab));
  $("dbody").innerHTML=tab==="prof"?profHtml():tab==="own"?ownHtml():tab==="book"?bookHtml():"<h3>ซื้อวัตถุดิบ</h3>"+shopHtml()+"<h3>คลังสต็อก</h3>"+backHtml();
}

function openDlg(t,hl){
  if(t==="book"&&(tab!=="book"||!$("dlg").open)){bookOpen=false;bookPg=0}tab=t;hlIds=hl||[];drawDlg();
  const d=$("dlg");if(!d.open)d.showModal();peek(d.querySelector(`.tab[data-t="${tab}"]`));
  const h=d.querySelector(".hl");if(h)h.scrollIntoView({block:"center"});
}

const peek=b=>{if(!b)return;b.classList.add("peek");clearTimeout(b.pk);b.pk=setTimeout(()=>b.classList.remove("peek"),1600)};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{const pt=tab;tab=b.dataset.t;if(tab==="book"&&pt!=="book"){bookOpen=false;bookPg=0}hlIds=[];drawDlg();peek(b)});
$("dclose").onclick=()=>$("dlg").close();
$("dlg").addEventListener("click",e=>{if(!e.composedPath().some(n=>n.classList&&(n.classList.contains("dmain")||n.classList.contains("tab"))))$("dlg").close()});
$("dlg").addEventListener("close",()=>renderStock());

$("dbody").addEventListener("click",e=>{
  const b=e.target.closest("[data-buy]");
  if(b){
    const id=b.dataset.buy,q=+b.dataset.q;
    const add=Math.min(q,99-st(id));
    if(add<=0){toast("ตู้เย็นเก็บ"+nm(id)+"ได้สูงสุด 99 ชิ้น");return}
    const cost=PRICE[id]*add;if(window.G.coins<cost)return;
    window.G.coins-=cost;window.G.stock[id]=st(id)+add;addLog("ซื้อ "+nm(id)+" ×"+add,-cost);saveG();
    drawDlg();renderStock();return;
  }
  if(e.target.id==="rst"){
    if(!rstArm){rstArm=true;e.target.textContent="กดอีกครั้งเพื่อยืนยันการรีเซ็ต";return}
    const s0={};ITEMS.forEach(i=>{s0[i[0]]=1});
    window.G={coins:50,stock:s0,last:"",log:[{t:Date.now(),d:"เริ่มใหม่ โบนัสเริ่มต้น",c:50},{t:Date.now(),d:"รับวัตถุดิบเริ่มต้น อย่างละ 1 ชิ้น",c:0}],cooked:{},starter:true};
    saveG();sel.length=0;render();drawDlg();renderUser();
  }
});

$("chk").onclick=checkIn;
$("shopb").onclick=()=>openDlg("shop");
$("bookb").onclick=()=>openDlg("book");

document.addEventListener("click",e=>{
  const b=e.target.closest(".it");if(!b||sel.includes(b.dataset.id))return;
  if(st(b.dataset.id)<=0){e.stopImmediatePropagation();toast(nm(b.dataset.id)+" หมด ไปซื้อที่ร้านค้าได้เลย");openDlg("shop",[b.dataset.id])}
},true);

$("recl").addEventListener("click",e=>{
  const b=e.target.closest(".rc");if(!b)return;
  const r=R[+b.dataset.n],S=new Set(sel),miss=r.need.filter(i=>st(i)<=0);
  if(r.any){
    const a=r.any.find(x=>S.has(x)&&st(x)>0)||r.any.find(x=>st(x)>0);
    if(a){if(!S.has(a))sel.push(a)}else miss.push(r.any[0]);
  }
  if(miss.length){e.stopImmediatePropagation();toast("ขาด "+miss.map(nm).join(", ")+" ในตู้เย็น");openDlg("shop",miss)}
},true);

let PS=[];
const oldMix=$("mix").onclick;
$("mix").onclick=()=>{
  if(cooking)return;
  const S=[...sel],rr=forceR||pick2(S);
  if(K.busy){toast("รอสักครู่ กำลังทำอยู่");return}
  if(rr){const ms=kMissing(rr);if(ms){toast(ms.msg);kScrollTo(ms.at);return}}
  oldMix();
  if(!rr)return;
  cooking=true;
  setTimeout(()=>{cookDone(rr,S);cooking=false},620);
};

function cookDone(r,S){
  if(!window.G.cooked) window.G.cooked = {};
  const first=!window.G.cooked[r.n],tot=r.weird?(first?1:0):first?Math.min(10,3*S.length+5):Math.min(3,S.length);
  S.forEach(i=>{window.G.stock[i]=Math.max(0,st(i)-1)});
  window.G.plates=Math.max(0,kPlates()-1);window.G.dirty=Math.min(8,kDirty()+1);
  window.G.cooked[r.n]=(window.G.cooked[r.n]||0)+1;window.G.coins+=tot;addLog("ทำ "+r.n,tot);saveG();
  sel.length=0;render();
  const m=$("menu");m.hidden=false;
  if(r.weird){
    m.insertAdjacentHTML("beforeend",`<p class="reward">${coinIc} กินไม่ได้จริงๆ วัตถุดิบทุกอย่างหายไปอย่างละ 1 ${tot?"ได้เหรียญปลอบใจ +"+tot+" ค้นพบเมนูลับ! เพิ่มสูตรลงสมุดแล้ว":"ไม่ได้เหรียญ"}</p>`);
    renderWallet(true);toast(tot?"ค้นพบเมนูลับ ห้ามกิน! +"+tot+" เหรียญปลอบใจ":"บอกแล้วว่าอย่าหาทำ");return;
  }
  m.insertAdjacentHTML("beforeend",`<p class="reward">${coinIc} ได้รับ +${tot} เหรียญ ${first?"("+S.length+" วัตถุดิบ × 3 + เมนูใหม่ 5 สูงสุด 10)":"(ทำเมนูเดิมซ้ำ ได้ 1 เหรียญต่อวัตถุดิบ สูงสุด 3)"}${first?(r.secret?" ค้นพบเมนูลับ! เพิ่มสูตรลงสมุดแล้ว":" เพิ่มสูตรลงสมุดแล้ว"):""} ใช้วัตถุดิบไปอย่างละ 1</p>`);
  renderWallet(true);
  toast("ทำ "+r.n+" สำเร็จ +"+tot+" เหรียญ"+(first?(r.secret?" ค้นพบเมนูลับ! เพิ่มสูตรลงสมุดแล้ว":" เพิ่มสูตรลงสมุดแล้ว"):""));
}

window.authInfo={google:false,name:"",photo:"",status:"ล็อกอินกูเกิลเพื่อเซฟคลาวด์อัตโนมัติ"};
const DEF_AV="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238a7a62'><circle cx='12' cy='8' r='4'/><path d='M12 14c-6.1 0-8 4-8 4v2h16v-2s-1.9-4-8-4z'/></svg>";
function prof(){const g=window.G;if(!g.profile)g.profile={name:"",avatar:"",frames:[],frame:""};const p=g.profile;if(!Array.isArray(p.frames))p.frames=[];return p}
const avSrc=()=>{const p=prof(),a=window.authInfo||{};return p.avatar||(a.google&&a.photo)||DEF_AV};
function fitName(){
  const u=$("uname"),cs=getComputedStyle(u),m=document.createElement("span");
  m.style.cssText="position:absolute;visibility:hidden;white-space:pre;font-style:"+cs.fontStyle+";font-weight:"+cs.fontWeight+";font-size:"+cs.fontSize+";font-family:"+cs.fontFamily+";letter-spacing:"+cs.letterSpacing;
  m.textContent=u.value||u.placeholder;document.body.appendChild(m);
  u.style.width=Math.ceil(m.getBoundingClientRect().width)+30+"px";m.remove();
}
const defName=()=>{const a=window.authInfo||{};return a.google?(a.name||"ผู้ใช้ Google"):"ผู้เยี่ยมชม"};

$("dbody").addEventListener("click",e=>{
  const t=e.target,p=prof(),fb=t.closest("[data-fbuy]"),fe=t.closest("[data-feq]");
  if(fb){
    const f=FR.find(x=>x[0]===fb.dataset.fbuy);
    if(!f||p.frames.includes(f[0]))return;
    if(window.G.coins<f[2]){toast("เหรียญไม่พอ");return}
    window.G.coins-=f[2];p.frames.push(f[0]);p.frame=f[0];addLog("ซื้อ"+f[1],-f[2]);saveG();
    renderWallet(true);renderUser();drawDlg();toast("ซื้อ"+f[1]+"แล้ว ใส่ให้เลย");return;
  }
  if(fe){p.frame=p.frame===fe.dataset.feq?"":fe.dataset.feq;saveG();renderUser();drawDlg();return}
  if(t.id==="pimgdel"){p.avatar="";saveG();renderUser();drawDlg()}
});
$("dbody").addEventListener("change",e=>{
  if(e.target.id!=="pimg")return;
  const f=e.target.files&&e.target.files[0];if(!f)return;
  if(!f.type.startsWith("image/")){toast("เลือกไฟล์รูปภาพเท่านั้น");return}
  const url=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{
    const S=160,cv=document.createElement("canvas");cv.width=cv.height=S;
    const x=cv.getContext("2d"),m=Math.min(im.width,im.height);
    x.fillStyle="#fff";x.fillRect(0,0,S,S);
    x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);
    URL.revokeObjectURL(url);
    prof().avatar=cv.toDataURL("image/jpeg",.85);saveG();renderUser();drawDlg();toast("เปลี่ยนรูปโปรไฟล์แล้ว");
  };
  im.onerror=()=>{URL.revokeObjectURL(url);toast("เปิดรูปนี้ไม่ได้ ลองไฟล์อื่น")};
  im.src=url;
});

function shrinkImg(f){
  return new Promise((ok,no)=>{
    const url=URL.createObjectURL(f),im=new Image();
    im.onload=()=>{
      URL.revokeObjectURL(url);
      const k=Math.min(1,768/Math.max(im.width,im.height)),W=Math.max(1,Math.round(im.width*k)),H=Math.max(1,Math.round(im.height*k));
      const wc=document.createElement("canvas");wc.width=W;wc.height=H;
      const wx=wc.getContext("2d",{willReadFrequently:true});wx.drawImage(im,0,0,W,H);
      let box={x0:0,y0:0,x1:W,y1:H};
      try{
        /* ลบพื้นหลังขาว/โปร่งใสที่ติดขอบภาพ แล้วตัดขอบว่างให้วัตถุเต็มกรอบ */
        const d=wx.getImageData(0,0,W,H),p=d.data,bg=new Uint8Array(W*H),st=[];
        const isBg=i=>p[i*4+3]<20||(p[i*4]>=232&&p[i*4+1]>=232&&p[i*4+2]>=232);
        const push=i=>{if(!bg[i]&&isBg(i)){bg[i]=1;st.push(i)}};
        for(let x=0;x<W;x++){push(x);push((H-1)*W+x)}
        for(let y=0;y<H;y++){push(y*W);push(y*W+W-1)}
        while(st.length){const i=st.pop(),x=i%W,y=(i-x)/W;if(x>0)push(i-1);if(x<W-1)push(i+1);if(y>0)push(i-W);if(y<H-1)push(i+W)}
        let x0=W,y0=H,x1=-1,y1=-1;
        for(let i=0;i<W*H;i++){if(bg[i])p[i*4+3]=0;else{const x=i%W,y=(i-x)/W;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}
        if(x1>=0&&(x1-x0)>W*.05&&(y1-y0)>H*.05){wx.putImageData(d,0,0);box={x0,y0,x1:x1+1,y1:y1+1}}
      }catch(e){}
      const bw=box.x1-box.x0,bh=box.y1-box.y0,L=Math.max(bw,bh)*1.1,sx=(box.x0+box.x1)/2-L/2,sy=(box.y0+box.y1)/2-L/2;
      for(const S of [384,320,256,192,144]){
        const cv=document.createElement("canvas");cv.width=cv.height=S;
        const x=cv.getContext("2d"),r=S/L;x.imageSmoothingQuality="high";
        x.drawImage(wc,-sx*r,-sy*r,W*r,H*r);
        let u=cv.toDataURL("image/webp",.9);
        if(!u.startsWith("data:image/webp"))u=cv.toDataURL("image/png");
        if(u.length<140000)return ok(u);
      }
      no(new Error("too big"));
    };
    im.onerror=()=>{URL.revokeObjectURL(url);no(new Error("bad image"))};
    im.src=url;
  });
}

function howOf(r){
  if(!r)return"none";
  if(r.weird)return"pot";
  if(/^(ต้ม|ข้าวต้ม|ไข่ตุ๋น|ปลาร้าทรง)/.test(r.n))return"pot";
  if(/^(ส้มตำ|ยำ|กุ้งแช่|ข้าวคลุก)/.test(r.n))return"none";
  return"pan";
}
function kReset(){K.cut=false;K.tool=null;K.cooked=false;K.plated=false}
const SW=1780,SH=560;
const ZONES={fridge:{x:326,y:36,w:380,h:490},stove:{x:880,y:30,w:304,h:350},board:{x:1172,y:236,w:318,h:140},cab:{x:1488,y:30,w:300,h:248},sink:{x:1478,y:250,w:304,h:130}};
const ZMAP={tPan:"stove",tPot:"stove",tSpat:"stove",tLadle:"stove",stStove:"stove",stOven:"stove",stBoard:"board",stCab:"cab",stSink:"sink"};
const cam={zone:"home",cx:516,cy:SH/2,s:1,tx:0,ty:0,b:null,dragged:false};
const kw=$("kwrap"),ksc=$("kscene"),hudT=$("hudTop"),hudB=$("hudBot");
let camAnim=null;
const noMotion=()=>matchMedia("(prefers-reduced-motion:reduce)").matches;
function camBounds(){
  const W=kw.clientWidth||innerWidth,H=kw.clientHeight||innerHeight;
  const pt=Math.ceil(hudT.getBoundingClientRect().bottom)+4;
  const pb=Math.ceil(H-hudB.getBoundingClientRect().top)+4;
  const AH=Math.max(160,H-pt-pb);
  document.documentElement.style.setProperty("--padB",pb+"px");document.documentElement.style.setProperty("--padT",pt+"px");
  return cam.b={W,H,pt,pb,AH,base:Math.max(AH/SH,W/SW)};
}
function camPose(cx,cy,s,b){
  const sw=SW*s,sh=SH*s;
  const tx=sw<=b.W?(b.W-sw)/2:Math.min(0,Math.max(b.W-sw,b.W/2-cx*s));
  const ty=sh<=b.AH?b.pt+(b.AH-sh)/2:Math.min(b.pt,Math.max(b.pt+b.AH-sh,b.pt+b.AH/2-cy*s));
  return{tx,ty,s,cx:(b.W/2-tx)/s,cy:(b.pt+b.AH/2-ty)/s};
}
const poseCss=p=>"translate("+p.tx+"px,"+p.ty+"px) scale("+p.s+")";
function camNow(){const m=new DOMMatrix(getComputedStyle(ksc).transform);return{tx:m.e,ty:m.f,s:m.a||1}}
function camArrows(b,p){
  const l=document.querySelector('[data-mv="-1"]'),r=document.querySelector('[data-mv="1"]');
  if(l)l.disabled=p.tx>=-1;if(r)r.disabled=p.tx<=b.W-SW*p.s+1;
}
function camApply(p,o){
  o=o||{};const b=o.b||cam.b||camBounds();
  const from=camNow();
  if(camAnim){camAnim.cancel();camAnim=null}
  ksc.style.transform=poseCss(p);
  Object.assign(cam,{tx:p.tx,ty:p.ty,s:p.s,cx:p.cx,cy:p.cy});window.KS=p.s;
  camArrows(b,p);
  if(!o.anim||noMotion())return;
  const kf=[{transform:"translate("+from.tx+"px,"+from.ty+"px) scale("+from.s+")"}];
  if(o.arc){
    const cxF=(b.W/2-from.tx)/from.s,sm=Math.max(b.W/SW,Math.min(from.s,p.s)*.62);
    kf.push({transform:poseCss(camPose((cxF+p.cx)/2,SH/2,sm,b)),offset:.45});
  }
  kf.push({transform:poseCss(p)});
  const a=ksc.animate(kf,{duration:o.arc?1050:760,easing:"cubic-bezier(.45,.05,.2,1)"});
  camAnim=a;a.onfinish=()=>{if(camAnim===a)camAnim=null};
}
function camGo(zone,o){
  o=o||{};const prev=cam.zone;
  document.body.dataset.zone=zone;
  const b=camBounds();let s,cx,cy;
  if(zone==="home"){s=b.base;cx=cam.cx;cy=SH/2}
  else{const z=ZONES[zone];s=Math.max(b.W/SW,Math.min(b.W*.94/z.w,b.AH*.94/z.h,b.base*2.4));cx=z.x+z.w/2;cy=z.y+z.h/2}
  cam.zone=zone;
  camApply(camPose(cx,cy,s,b),{b,anim:!o.instant,arc:prev!=="home"&&zone!=="home"&&prev!==zone});
}
function camPan(dx,anim){camApply(camPose(cam.cx+dx,cam.cy,cam.s,cam.b||camBounds()),{anim:anim})}
function kScrollTo(k){camGo(k==="serve"?"home":k)}
function kMissing(r){
  const how=howOf(r);

  if(!K.plated)return{msg:"ยังไม่ได้หยิบจาน แตะตู้ไม้เหนือซิงค์",at:"cab"};
  return null;
}

  const done={pick:has,cut:has&&(!nc||K.cut),cook:has&&!!r&&(how==="none"||K.cooked),plate:K.plated};
  document.querySelectorAll("#steps button[data-s]").forEach(b=>{const k=b.dataset.s;b.classList.toggle("done",!!done[k]);b.classList.toggle("now",k===stg)});

  nx.forEach(id=>{const e=$(id);if(e)e.classList.add("next");const l=$(id+"L");if(l)l.classList.add("next")});
  if(stg==="cook"&&!K.tool)$("tPanL").classList.add("next");

  $("kPan").style.display=K.tool==="pan"?"block":"none";
  $("kPot").style.display=K.tool==="pot"?"block":"none";
  $("kPanItems").innerHTML=K.tool==="pan"?sel.filter(i=>!sea(i)).slice(0,4).map(i=>ic(i)).join(""):"";
  ["tPan","tSpat"].forEach(id=>$(id).classList.toggle("taken",K.tool==="pan"));
  ["tPot","tLadle"].forEach(id=>$(id).classList.toggle("taken",K.tool==="pot"));
  const cp=Math.max(0,kPlates()-(K.plated?1:0));
  $("kPlates").innerHTML=Array.from({length:cp},(_,i)=>`<i class="pl" style="--i:${i}"></i>`).join("");
  $("kDirty").innerHTML=Array.from({length:kDirty()},(_,i)=>`<i class="dp" style="--i:${i}"></i>`).join("");
}
function kBusy(cls,ms,done){
  K.busy=true;$("kscene").classList.add(cls);
  setTimeout(()=>{K.busy=false;$("kscene").classList.remove(cls);done();kUpdate()},ms);
}
const kNeedBasket=()=>{toast("ตะกร้ายังว่าง หยิบวัตถุดิบจากตู้เย็นก่อน");kScrollTo("fridge")};
const kNoMenu=()=>toast("ของชุดนี้ยังไม่เข้ากับเมนูไทยที่รู้จัก ลองปรับวัตถุดิบในตะกร้า");
function kChop(){
  if(K.busy)return;
  if(!sel.length)return kNeedBasket();
  if(!needsCut()){K.cut=true;toast("วัตถุดิบชุดนี้ไม่ต้องหั่น ไปปรุงได้เลย");kUpdate();return}
  if(K.cut){toast("หั่นเสร็จแล้ว ไปที่เตาต่อได้เลย");return}
  kBusy("chop",1500,()=>{K.cut=true;toast("หั่นเสร็จแล้ว")});
}
function kTool(t){
  if(K.busy)return;
  if(!sel.length)return kNeedBasket();
  if(K.cooked){toast("ปรุงเสร็จแล้ว ไปจัดจานได้เลย");return}
  const r=kPreview();
  if(!r)return kNoMenu();
  const how=howOf(r);
  if(how==="none"){toast(r.n+" ไม่ต้องใช้เตา ไปจัดจานได้เลย");K.cooked=true;kUpdate();return}
  if(how!==t){toast(how==="pot"?"เมนูต้มและตุ๋นต้องใช้หม้อ":"เมนูผัดและทอดต้องใช้กระทะ");return}
  K.tool=t;toast(t==="pot"?"ตั้งหม้อบนเตาแล้ว แตะเตาเพื่อเริ่มต้ม":"ตั้งกระทะบนเตาแล้ว แตะเตาเพื่อเริ่มผัด");kUpdate();kScrollTo("stove");
}
function kCook(){
  if(K.busy)return;
  if(!sel.length)return kNeedBasket();
  const r=kPreview();
  if(!r)return kNoMenu();
  const how=howOf(r);
  if(how==="none"){toast(r.n+" ไม่ต้องใช้เตา ไปจัดจานได้เลย");K.cooked=true;kUpdate();return}
  if(needsCut()&&!K.cut){toast("หั่นวัตถุดิบที่เขียงก่อน");kScrollTo("board");return}
  if(!K.tool){toast("เลือกกระทะหรือหม้อจากผนังเหนือเตาก่อน");return}
  if(K.cooked){toast("ปรุงสุกแล้ว ไปจัดจานได้เลย");return}
  kBusy("cooking",2400,()=>{K.cooked=true;toast("สุกแล้ว หอมน่ากิน")});
}
function kPlate(){
  if(K.busy)return;
  if(!sel.length)return kNeedBasket();
  const r=kPreview();
  if(!r)return kNoMenu();
  const m=kMissing(r);
  if(m&&m.at!=="cab"){toast(m.msg);kScrollTo(m.at);return}
  if(K.plated){toast("หยิบจานแล้ว กด เสิร์ฟเมนู ได้เลย");return}
  if(kPlates()<=0){toast("จานสะอาดหมด ไปล้างจานที่ซิงค์ก่อน");kScrollTo("sink");return}
  K.plated=true;toast("หยิบจานแล้ว กด เสิร์ฟเมนู ได้เลย");kUpdate();kScrollTo("serve");
}
function kWash(){
  if(K.busy)return;
  const d=kDirty();
  if(!d){toast("ไม่มีจานสกปรก จานสะอาดอยู่ "+kPlates()+" ใบ");return}
  kBusy("wash",1600,()=>{window.G.plates=Math.min(8,kPlates()+d);window.G.dirty=0;saveG();toast("ล้างจานเสร็จแล้ว จานสะอาด "+kPlates()+" ใบ")});
}
$("steps").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)kScrollTo(b.dataset.go)});
document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>camPan(+b.dataset.mv*(cam.b?cam.b.W:innerWidth)/cam.s*.5,true));
$("zout").onclick=()=>camGo("home");
$("tPan").onclick=$("tSpat").onclick=()=>kTool("pan");
$("tPot").onclick=$("tLadle").onclick=()=>kTool("pot");
$("stStove").onclick=kCook;
$("stBoard").onclick=kChop;
$("stCab").onclick=kPlate;
$("stSink").onclick=kWash;
const bp=$("bpanel");
function trayOpen(on){bp.classList.toggle("open",on);$("kbasket").setAttribute("aria-expanded",on)}
$("kbasket").onclick=()=>trayOpen(!bp.classList.contains("open"));
document.addEventListener("click",e=>{if(bp.classList.contains("open")&&!e.target.closest("#bpanel,.it,.chip"))trayOpen(false)});
$("mclose").onclick=()=>{$("menu").hidden=true};
$("mwin").addEventListener("click",e=>{if(e.target===$("mwin"))$("menu").hidden=true});

$("stOven").onclick=()=>{const on=$("kOvenGlow").classList.toggle("on");toast(on?"เปิดไฟเตาอบแล้ว ตอนนี้เตาอบยังไม่มีเมนูให้อบ":"ปิดไฟเตาอบแล้ว")};
function kTime(){
  const d=new Date(),h=d.getHours()+d.getMinutes()/60,sc=$("kscene"),m=d.getMinutes(),hh=(d.getHours()%12)+m/60;
  sc.classList.remove("day","eve","night");sc.classList.add(h>=6&&h<16?"day":h>=16&&h<19?"eve":"night");
  $("kcM").setAttribute("transform","rotate("+m*6+" 795 140)");$("kcH").setAttribute("transform","rotate("+hh*30+" 795 140)");
}
kTime();setInterval(kTime,60000);
/* camera input: drag / wheel / keys, first-tap zoom, resize */
let pd=null;
kw.addEventListener("pointerdown",e=>{
  if(e.pointerType==="mouse"&&e.button!==0)return;
  const inFr=e.target.closest(".fridge");
  if(inFr&&cam.zone==="fridge")return;
  if(e.target.closest("input,select,textarea"))return;
  pd={id:e.pointerId,x:e.clientX,moved:false};
  if(inFr)e.stopPropagation();
},true);
window.addEventListener("pointermove",e=>{
  if(!pd||e.pointerId!==pd.id)return;
  const dx=e.clientX-pd.x;
  if(!pd.moved){if(Math.abs(dx)<7)return;pd.moved=true;try{kw.setPointerCapture(pd.id)}catch(_){}kw.classList.add("drag")}
  pd.x=e.clientX;camPan(-dx/cam.s,false);
});
const pdEnd=e=>{if(!pd||e.pointerId!==pd.id)return;if(pd.moved){cam.dragged=true;setTimeout(()=>{cam.dragged=false},60)}pd=null;kw.classList.remove("drag")};
window.addEventListener("pointerup",pdEnd);window.addEventListener("pointercancel",pdEnd);
kw.addEventListener("wheel",e=>{
  if(e.ctrlKey)return;
  const sh=e.target.closest&&e.target.closest("#shelves");
  if(sh&&sh.scrollHeight>sh.clientHeight+1)return;
  e.preventDefault();
  const k=e.deltaMode===1?16:1,d=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)*k;
  camPan(d/cam.s,false);
},{passive:false});
window.addEventListener("click",e=>{
  if(cam.dragged){cam.dragged=false;e.stopPropagation();e.preventDefault();return}
  const t=e.target;if(!t.closest||!t.closest("#kwrap"))return;
  const st=t.closest(".st");let z=null;
  if(st&&ZMAP[st.id])z=ZMAP[st.id];else if(t.closest(".fridge"))z="fridge";
  if(z&&cam.zone!==z){e.stopPropagation();e.preventDefault();camGo(z)}
},true);
kw.addEventListener("focusin",e=>{
  const t=e.target;if(!t.matches||!t.matches(":focus-visible"))return;
  const st=t.closest(".st");const z=st&&ZMAP[st.id]?ZMAP[st.id]:t.closest(".fridge")?"fridge":null;
  if(z&&cam.zone!==z)camGo(z);
});
document.addEventListener("keydown",e=>{
  if(e.target.closest&&e.target.closest("input,textarea,select,[contenteditable],.stk"))return;
  if(document.querySelector("dialog[open]"))return;
  if(e.key==="Escape"){
    if(!$("menu").hidden){$("menu").hidden=true;return}
    if(bp.classList.contains("open")){trayOpen(false);return}
    if(cam.zone!=="home")camGo("home");return;
  }
  if(e.key==="ArrowLeft"||e.key==="ArrowRight")camPan((e.key==="ArrowLeft"?-1:1)*cam.b.W/cam.s*.35,true);
});
document.querySelector(".decor").addEventListener("toggle",()=>camGo(cam.zone));
let kRz=null;window.addEventListener("resize",()=>{clearTimeout(kRz);kRz=setTimeout(()=>camGo(cam.zone,{instant:true}),80)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>camGo(cam.zone,{instant:true}));
document.body.dataset.zone="home";
camGo("home",{instant:true});
drawStk();
render();
renderUser();
</script>
</body>
</html>
